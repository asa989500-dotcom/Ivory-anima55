name: Build IVORY C++ Android GDExtension

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ivory/**'
      - 'ivory.gdextension'
      - '.github/workflows/build-ivory-android.yml'

jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout IVORY
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK platform, build-tools and NDK
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android environment
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$NDK" >> "$GITHUB_PATH"

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip scons

      - name: Build IVORY Android ARM64 editor
        working-directory: native/ivory
        run: scons platform=android arch=arm64 target=editor ndk_version=27.2.12479018 -j2

      - name: Build IVORY Android ARM64 release
        working-directory: native/ivory
        run: scons platform=android arch=arm64 target=template_release ndk_version=27.2.12479018 -j2

      - name: Build IVORY Android ARM64 debug
        working-directory: native/ivory
        run: scons platform=android arch=arm64 target=template_debug ndk_version=27.2.12479018 -j2

      - name: Validate native outputs and GDExtension mapping
        run: python native/ivory/ci/validate_android_build.py

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ivory-android-arm64-native
          path: |
            bin/libivory.android.editor.arm64.so
            bin/libivory.android.template_release.arm64.so
            bin/libivory.android.template_debug.arm64.so
            ivory.gdextension
            native/ivory/BUILD_NATIVE_PICKER.md

  android-media-plugin:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout IVORY
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Godot 4.7 export templates
        shell: bash
        run: |
          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz"
          unzip -q templates.tpz -d templates_extracted

      - name: Locate and place godot-lib aar
        shell: bash
        run: |
          echo "== Top-level structure =="
          find templates_extracted -maxdepth 3
          echo "== Direct search for aar =="
          find templates_extracted -iname "godot-lib*.aar" || true

          AAR=$(find templates_extracted -iname "godot-lib*template_release*.aar" | head -n1)

          if [ -z "$AAR" ]; then
            echo "Not found directly - looking for a nested zip (e.g. android_source.zip) to extract"
            NESTED_ZIP=$(find templates_extracted -iname "android_source.zip" | head -n1)
            if [ -n "$NESTED_ZIP" ]; then
              echo "Extracting nested zip: $NESTED_ZIP"
              unzip -q "$NESTED_ZIP" -d templates_extracted/android_source_unzipped
              AAR=$(find templates_extracted/android_source_unzipped -iname "godot-lib*template_release*.aar" | head -n1)
            fi
          fi

          if [ -z "$AAR" ]; then
            echo "Still not found - searching for ANY .aar file as a last resort"
            find templates_extracted -iname "*.aar"
            AAR=$(find templates_extracted -iname "*.aar" | grep -i "godot" | head -n1)
          fi

          echo "Resolved AAR path: $AAR"
          if [ -z "$AAR" ]; then
            echo "FATAL: could not locate godot-lib aar anywhere in the templates package"
            exit 1
          fi

          mkdir -p android/plugin_src/ivory_media/libs
          cp "$AAR" android/plugin_src/ivory_media/libs/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build IvoryMedia plugin AAR
        working-directory: android/plugin_src
        run: gradle :ivory_media:assembleRelease --no-daemon

      - name: Collect plugin output
        shell: bash
        run: |
          mkdir -p android/plugins
          find android/plugin_src -iname "*.aar"
          cp android/plugin_src/ivory_media/build/outputs/aar/ivory_media.release.aar android/plugins/ivory_media.aar

      - name: Upload IvoryMedia plugin
        uses: actions/upload-artifact@v4
        with:
          name: ivory-media-plugin
          path: |
            android/plugins/ivory_media.aar
            android/plugins/ivory_media.gdap
