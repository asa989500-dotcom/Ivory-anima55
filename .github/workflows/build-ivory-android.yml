name: Build IVORY C++ Android GDExtension

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ivory/**'
      - 'ivory.gdextension'
      - '.github/workflows/build-ivory-android.yml'

jobs:
  android-arm64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout IVORY
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK platform, build-tools and NDK
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Configure Android environment
        shell: bash
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "$NDK" >> "$GITHUB_PATH"

      - name: Set up Python and SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip scons

      - name: Build IVORY Android ARM64 release
        working-directory: native/ivory
        run: scons platform=android arch=arm64 target=template_release ndk_version=27.2.12479018 -j2

      - name: Build IVORY Android ARM64 debug
        working-directory: native/ivory
        run: scons platform=android arch=arm64 target=template_debug ndk_version=27.2.12479018 -j2

      - name: Validate native outputs and GDExtension mapping
        run: python native/ivory/ci/validate_android_build.py

      - name: Upload Android native libraries
        uses: actions/upload-artifact@v4
        with:
          name: ivory-android-arm64-native
          path: |
            bin/libivory.android.template_release.arm64.so
            bin/libivory.android.template_debug.arm64.so
            ivory.gdextension
            native/ivory/BUILD_NATIVE_PICKER.md
