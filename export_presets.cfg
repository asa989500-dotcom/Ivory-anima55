; IVORY — export presets
;
; This file is what was missing. Without it there is no APK: the editor has
; nothing to export and the command line has no preset name to be given.
;
; Two presets:
;   "Android"          the tablet build, this is the one that matters
;   "Linux/X11"        a desktop build, only so the automated tests and the
;                      benchmark can be run somewhere with a keyboard
;
; Passwords are deliberately absent. Godot reads them from the environment
; when they are not in the file:
;
;   GODOT_ANDROID_KEYSTORE_DEBUG_PATH / _USER / _PASSWORD
;   GODOT_ANDROID_KEYSTORE_RELEASE_PATH / _USER / _PASSWORD
;
; so a release can be built on any machine without a secret ever entering
; version control. See BUILD_ANDROID.md.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.gd, *.gdshader, *.png, *.tscn, *.json"
exclude_filter="tests/*, tools/*, *.md, android/keystore/*"
export_path="build/IVORY.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""

; Gradle off. The prebuilt template is enough for this app — nothing here
; needs a Java plugin — and turning it on adds an Android SDK and a Gradle
; run to every build. Turn it on only if a plugin is ever added.
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android"
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
plugins/IvoryMedia=true
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="34"

; 64-bit only. Every Android device that can run this app has an arm64
; processor, Play has required 64-bit since 2019, and carrying the 32-bit
; libraries as well nearly doubles the size of the APK for nothing.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

version/code=90
version/name="0.90"

package/unique_name="com.aaje.ivory"
package/name="IVORY"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false

; Built by tools/make_android_icons.py from icon.png. The foreground sits
; inside the safe circle and the background is the flat colour it was lifted
; off, so a round launcher mask crops nothing.
launcher_icons/main_192x192="res://android/icons/launcher_192.png"
launcher_icons/adaptive_foreground_432x432="res://android/icons/adaptive_foreground_432.png"
launcher_icons/adaptive_background_432x432="res://android/icons/adaptive_background_432.png"
launcher_icons/adaptive_monochrome_432x432="res://android/icons/adaptive_monochrome_432.png"

graphics/opengl_debug=false
xr_features/xr_mode=0

; Full screen, no system bars over the canvas.
screen/immersive_mode=true
screen/support_small=false
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; The projects live in the app's own storage and are what the user cannot
; afford to lose, so let the system back them up.
user_data_backup/allow=true

command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""

; ---------------------------------------------------------------- permissions
;
; Reading is for importing a picture into a layer; writing is for exports
; landing where a gallery app can see them, which was asked for explicitly.
;
; On Android 13 and later READ_EXTERNAL_STORAGE stopped covering pictures,
; so READ_MEDIA_IMAGES is here as well — an import that works on Android 12
; and silently finds nothing on Android 14 is exactly the kind of failure
; that reads as "the app is broken".
;
; MANAGE_EXTERNAL_STORAGE is deliberately NOT requested. It is the one
; Play reviews by hand and rejects for apps that do not need it, and IVORY
; does not: the export path goes through the media directories.
permissions/custom_permissions=PackedStringArray()
permissions/read_external_storage=true
permissions/write_external_storage=true
permissions/read_media_images=true
permissions/read_media_video=false
permissions/read_media_audio=false
permissions/manage_external_storage=false
; The AI unit is the only thing in IVORY that reaches the network, and
; without these two it cannot: an APK built with INTERNET off does not fail
; politely, it simply never connects, which reads as "the AI is broken".
; ACCESS_NETWORK_STATE is beside it so a request made with the aeroplane mode
; on can say so instead of timing out after two minutes.
permissions/access_network_state=true
permissions/internet=true
permissions/vibrate=false
permissions/wake_lock=false

keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

[preset.1]

name="Linux/X11"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="android/keystore/*"
export_path="build/ivory.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
